name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        httpx: ['']
        include:
          # The oldest httpx the package allows (dependencies: httpx>=0.26).
          - python-version: '3.9'
            httpx: '0.26.*'
    name: Python ${{ matrix.python-version }}${{ matrix.httpx && format(' (httpx {0})', matrix.httpx) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"
        if: matrix.httpx == ''
      - run: pip install -e ".[dev]" "httpx==${{ matrix.httpx }}"
        if: matrix.httpx != ''
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
